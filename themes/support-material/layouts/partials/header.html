<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-name">Support Material</span>
      <span class="brand-slogan">{{ site.Params.slogan }}</span>
    </a>
    <nav aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9A9 9 0 0 0 12 3zm0 16V5a7 7 0 0 1 0 14z"/></svg>
      </button>
    </nav>
  </div>
</header>
